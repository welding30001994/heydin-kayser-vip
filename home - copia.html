<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO·GASTOS · Control Financiero 2077</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #0a0f1e, #030514);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: #ccd6f0;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Efecto de líneas de grid futurista */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
        }

        /* Header cyber */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 3rem;
            padding: 1.5rem 2rem;
            background: rgba(10, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 40px 40px 20px 20px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            background: linear-gradient(135deg, #a0f0ff, #6b8cff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 15px cyan;
        }

        .title span {
            font-size: 1rem;
            background: rgba(0, 255, 255, 0.2);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid cyan;
            color: #b0f0ff;
            margin-left: 15px;
            letter-spacing: 1px;
        }

        .total-card {
            background: rgba(0, 15, 30, 0.8);
            border: 1px solid #00ffff;
            border-radius: 30px;
            padding: 1.2rem 2.5rem;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0,255,200,0.3);
            backdrop-filter: blur(8px);
        }

        .total-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #9cdbff;
        }

        .total-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.2;
            background: linear-gradient(to right, #fff, #7df9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px cyan;
        }

        /* Panel de registro */
        .panel {
            background: rgba(8, 18, 28, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(64, 224, 255, 0.5);
            border-radius: 40px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px rgba(0,255,200,0.1) inset;
        }

        .panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #b0f5ff;
            text-shadow: 0 0 5px cyan;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #80e0ff;
        }

        .input-group input, .input-group select {
            background: rgba(0, 30, 50, 0.8);
            border: 1px solid #00b8ff;
            border-radius: 40px;
            padding: 14px 20px;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ff77ff;
            box-shadow: 0 0 20px #ff77ff, 0 0 5px #00ffff inset;
            background: rgba(0, 20, 40, 0.9);
        }

        .input-group input::placeholder {
            color: #a0b0c0;
            opacity: 0.6;
        }

        .btn-neon {
            background: transparent;
            border: 2px solid #0ff;
            border-radius: 60px;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #0ff;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px #0ff;
            font-family: 'Orbitron', sans-serif;
            backdrop-filter: blur(5px);
            margin-top: 1.8rem;
        }

        .btn-neon:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 45px cyan, 0 0 90px blue;
            border-color: cyan;
            font-weight: 800;
        }

        /* Tablero de estadísticas */
        .stats-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        @media (max-width: 800px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(8, 18, 28, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 30px;
            padding: 1.8rem;
            box-shadow: 0 10px 30px -10px black, 0 0 0 1px rgba(0,255,255,0.2) inset;
        }

        .card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1.8rem;
            color: #a0f0ff;
            border-bottom: 2px solid cyan;
            padding-bottom: 8px;
            display: inline-block;
        }

        /* Lista de gastos */
        .gastos-lista {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .gasto-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            margin-bottom: 10px;
            background: rgba(0, 40, 60, 0.4);
            border-left: 6px solid #0ff;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            border: 1px solid rgba(0,255,255,0.3);
        }

        .gasto-item:hover {
            background: rgba(0, 70, 100, 0.6);
            border-left-width: 12px;
            box-shadow: 0 0 20px cyan;
        }

        .gasto-info {
            display: flex;
            flex-direction: column;
        }

        .gasto-desc {
            font-weight: 600;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .gasto-cat {
            font-size: 0.85rem;
            color: #7ff0ff;
            text-transform: uppercase;
        }

        .gasto-monto {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #fff, #7ef0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-eliminar {
            background: none;
            border: 1px solid #ff5577;
            color: #ff99aa;
            border-radius: 30px;
            padding: 6px 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            margin-left: 15px;
        }

        .btn-eliminar:hover {
            background: #ff5577;
            color: black;
            box-shadow: 0 0 30px red;
        }

        /* Categorías (gráfico de barras conceptual) */
        .categoria-bar {
            margin: 15px 0;
        }

        .cat-label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 5px;
            color: #c0eaff;
        }

        .barra-fondo {
            background: rgba(0, 30, 50, 0.8);
            height: 30px;
            border-radius: 30px;
            border: 1px solid #0ff;
            overflow: hidden;
            box-shadow: inset 0 2px 8px black;
        }

        .barra-llenado {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #aa4aff);
            box-shadow: 0 0 20px #4abfff;
            border-radius: 30px;
            transition: width 0.4s ease;
        }

        .cat-valor {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            text-shadow: 0 0 5px cyan;
        }

        .reset-btn {
            background: transparent;
            border: 1px dashed #ff7760;
            color: #ffaaa0;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .reset-btn:hover {
            background: #ff5555;
            color: black;
            border: 1px solid red;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: #6080a0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">
            💳 NEO·GASTOS <span>v.2077</span>
        </div>
        <div class="total-card">
            <div class="total-label">TOTAL GASTADO</div>
            <div class="total-amount" id="totalDisplay">$0</div>
        </div>
    </div>

    <div class="panel">
        <h2>⍟ REGISTRO ENERGÉTICO ⍟</h2>
        <div class="form-grid">
            <div class="input-group">
                <label>DESCRIPCIÓN</label>
                <input type="text" id="descInput" placeholder="ej. Internet, Comida..." maxlength="30">
            </div>
            <div class="input-group">
                <label>MONTO $</label>
                <input type="number" id="montoInput" placeholder="0.00" min="0" step="0.01">
            </div>
            <div class="input-group">
                <label>CATEGORÍA</label>
                <select id="categoriaSelect">
                    <option value="Servicios Básicos">⚡ Servicios Básicos</option>
                    <option value="Comidas">🍕 Comidas</option>
                    <option value="Otros">🔮 Otros</option>
                </select>
            </div>
            <button class="btn-neon" id="agregarBtn">+ AGREGAR</button>
        </div>
    </div>

    <div class="stats-grid">
        <!-- Lista de gastos recientes -->
        <div class="card">
            <h3>📋 ÚLTIMOS REGISTROS</h3>
            <div class="gastos-lista" id="gastosLista">
                <!-- acá se renderizan los gastos -->
            </div>
            <button class="reset-btn" id="resetBtn">⟲ LIMPIAR TODO</button>
        </div>

        <!-- Análisis por categoría (barras) -->
        <div class="card">
            <h3>📊 ANÁLISIS SECTORIAL</h3>
            <div id="categoriasContainer">
                <div class="categoria-bar">
                    <div class="cat-label"><span>⚡ Servicios Básicos</span> <span class="cat-valor" id="totalServicios">$0</span></div>
                    <div class="barra-fondo"><div class="barra-llenado" id="barraServicios" style="width:0%"></div></div>
                </div>
                <div class="categoria-bar">
                    <div class="cat-label"><span>🍕 Comidas</span> <span class="cat-valor" id="totalComidas">$0</span></div>
                    <div class="barra-fondo"><div class="barra-llenado" id="barraComidas" style="width:0%"></div></div>
                </div>
                <div class="categoria-bar">
                    <div class="cat-label"><span>🔮 Otros</span> <span class="cat-valor" id="totalOtros">$0</span></div>
                    <div class="barra-fondo"><div class="barra-llenado" id="barraOtros" style="width:0%"></div></div>
                </div>
            </div>
            <p style="margin-top: 20px; color: #8ab3ff; font-size: 0.9rem; border-left: 2px solid cyan; padding-left: 15px;">
                ⚡ Proyección: <span id="categoriaMayor">—</span>
            </p>
        </div>
    </div>
    <footer>✦ SISTEMA DE GASTOS HOGAR · ALMACENAMIENTO LOCAL ✦</footer>
</div>

<script>
    (function() {
        // ---- DATOS ----
        let gastos = [];

        // Cargar de localStorage si existe
        const STORAGE_KEY = 'neoGastos';
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                gastos = JSON.parse(stored);
            } catch (e) {
                gastos = [];
            }
        }

        // Elementos DOM
        const totalDisplay = document.getElementById('totalDisplay');
        const gastosLista = document.getElementById('gastosLista');
        const agregarBtn = document.getElementById('agregarBtn');
        const descInput = document.getElementById('descInput');
        const montoInput = document.getElementById('montoInput');
        const categoriaSelect = document.getElementById('categoriaSelect');
        const resetBtn = document.getElementById('resetBtn');

        // Spans de totales por categoría
        const totalServiciosSpan = document.getElementById('totalServicios');
        const totalComidasSpan = document.getElementById('totalComidas');
        const totalOtrosSpan = document.getElementById('totalOtros');
        // Barras
        const barraServicios = document.getElementById('barraServicios');
        const barraComidas = document.getElementById('barraComidas');
        const barraOtros = document.getElementById('barraOtros');
        const categoriaMayorSpan = document.getElementById('categoriaMayor');

        // Funciones de render
        function renderTodo() {
            // Calcular totales
            const total = gastos.reduce((acc, g) => acc + g.monto, 0);
            totalDisplay.textContent = '$' + total.toFixed(2);

            // Por categoría
            const servicios = gastos.filter(g => g.categoria === 'Servicios Básicos').reduce((acc, g) => acc + g.monto, 0);
            const comidas = gastos.filter(g => g.categoria === 'Comidas').reduce((acc, g) => acc + g.monto, 0);
            const otros = gastos.filter(g => g.categoria === 'Otros').reduce((acc, g) => acc + g.monto, 0);

            totalServiciosSpan.textContent = '$' + servicios.toFixed(2);
            totalComidasSpan.textContent = '$' + comidas.toFixed(2);
            totalOtrosSpan.textContent = '$' + otros.toFixed(2);

            // Calcular porcentajes para barras (máximo de categoría o total general)
            const maxCategoria = Math.max(servicios, comidas, otros, 0.01);
            const porcentajeServicios = (servicios / maxCategoria) * 100;
            const porcentajeComidas = (comidas / maxCategoria) * 100;
            const porcentajeOtros = (otros / maxCategoria) * 100;

            barraServicios.style.width = (maxCategoria > 0 ? porcentajeServicios : 0) + '%';
            barraComidas.style.width = (maxCategoria > 0 ? porcentajeComidas : 0) + '%';
            barraOtros.style.width = (maxCategoria > 0 ? porcentajeOtros : 0) + '%';

            // Determinar categoría con mayor gasto
            const valores = [
                { nombre: 'Servicios Básicos', valor: servicios },
                { nombre: 'Comidas', valor: comidas },
                { nombre: 'Otros', valor: otros }
            ];
            const mayor = valores.reduce((max, item) => item.valor > max.valor ? item : max, { nombre: 'Ninguno', valor: 0 });
            categoriaMayorSpan.textContent = mayor.valor > 0 ? `${mayor.nombre} ($${mayor.valor.toFixed(2)})` : '—';

            // Render lista de gastos
            if (gastos.length === 0) {
                gastosLista.innerHTML = `<div style="padding: 30px; text-align: center; color: #6fa8bb; border: 1px dashed cyan; border-radius: 40px;">⍟ No hay registros. Añade uno. ⍟</div>`;
            } else {
                let html = '';
                // Mostrar de más nuevo a más viejo (invertir para que último sea primero)
                [...gastos].reverse().forEach((gasto, index) => {
                    const originalIndex = gastos.length - 1 - index;
                    html += `
                        <div class="gasto-item">
                            <div class="gasto-info">
                                <span class="gasto-desc">${gasto.descripcion}</span>
                                <span class="gasto-cat">${gasto.categoria}</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span class="gasto-monto">$${gasto.monto.toFixed(2)}</span>
                                <button class="btn-eliminar" data-index="${originalIndex}">✕</button>
                            </div>
                        </div>
                    `;
                });
                gastosLista.innerHTML = html;

                // Asignar eventos a botones eliminar
                document.querySelectorAll('.btn-eliminar').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = btn.getAttribute('data-index');
                        if (idx !== null) {
                            eliminarGasto(parseInt(idx));
                        }
                    });
                });
            }

            // Guardar en localStorage
            localStorage.setItem(STORAGE_KEY, JSON.stringify(gastos));
        }

        function eliminarGasto(index) {
            if (index >= 0 && index < gastos.length) {
                gastos.splice(index, 1);
                renderTodo();
            }
        }

        function agregarGasto() {
            const desc = descInput.value.trim();
            const monto = parseFloat(montoInput.value);
            const categoria = categoriaSelect.value;

            if (!desc) {
                alert('⚠️ Ingresa una descripción.');
                return;
            }
            if (isNaN(monto) || monto <= 0) {
                alert('⚠️ Monto inválido (debe ser mayor a 0).');
                return;
            }

            gastos.push({
                descripcion: desc,
                monto: monto,
                categoria: categoria
            });

            // Resetear campos
            descInput.value = '';
            montoInput.value = '';
            categoriaSelect.value = 'Servicios Básicos'; // default

            renderTodo();
        }

        function resetAll() {
            if (gastos.length > 0 && confirm('¿Eliminar TODOS los registros? Esta acción es permanente.')) {
                gastos = [];
                renderTodo();
            }
        }

        // Event listeners
        agregarBtn.addEventListener('click', agregarGasto);

        resetBtn.addEventListener('click', resetAll);

        // Permitir enter en campos (opcional)
        [descInput, montoInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') agregarGasto();
            });
        });

        // Inicializar render
        renderTodo();
    })();
</script>
</body>
</html>
