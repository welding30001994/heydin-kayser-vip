<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>YESLY ADELAY · Dashboard VIP</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Syne:wght@400;700;800;900&family=Rajdhani:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --primary: #00f0ff;
            --accent: #ff44e6;
            --gold: #ffd700;
            --dark: #0a0a1a;
            --darker: #050510;
            --light: #e0e0ff;
            --card-bg: rgba(15, 15, 35, 0.7);
            --neon-glow: 0 0 10px var(--primary), 0 0 20px rgba(0, 240, 255, 0.3);
            --folder-color: #00f0ff;
            --folder-hover: #ff44e6;
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Orbitron', 'Syne', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: #eef5ff;
            background: var(--darker);
        }

        /* ===== FONDO CON IMAGEN TRANSPARENTE ===== */
        .bg-image-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://raw.githubusercontent.com/welding30001994/heydin-kayser-vip/refs/heads/main/YESLY.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 0.10;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== CAPAS DE FONDO ===== */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.03), rgba(0, 0, 0, 0.92));
            z-index: 2;
            pointer-events: none;
        }

        /* ===== CONTENIDO ===== */
        .content {
            position: relative;
            z-index: 15;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== LOADER ===== */
        .loader-container {
            position: fixed;
            inset: 0;
            background: rgba(1, 1, 11, 0.92);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .loader-container.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .loader-ring {
            width: 70px;
            height: 70px;
            border: 3px solid rgba(0,255,255,0.2);
            border-top: 3px solid var(--primary);
            border-right: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 25px var(--primary);
        }
        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
        .loader-text {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ===== HEADER ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 200;
            padding: 10px 0;
            background: rgba(10, 10, 26, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 900;
            font-family: 'Syne', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .logo i {
            color: var(--primary);
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .logo span {
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .user-name {
            color: var(--primary);
            font-size: clamp(0.65rem, 1.3vw, 0.85rem);
            font-weight: 700;
            text-shadow: 0 0 8px var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            background: rgba(0, 240, 255, 0.05);
        }

        .logout-btn {
            padding: 6px 16px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-size: clamp(0.55rem, 1vw, 0.7rem);
        }

        .logout-btn:hover {
            background: rgba(0, 240, 255, 0.1);
        }

        /* ===== BIENVENIDA ===== */
        .welcome-section {
            text-align: center;
            padding: 18px 20px 5px;
        }

        .welcome-title {
            font-size: clamp(1.3rem, 4vw, 2.5rem);
            font-weight: 900;
            font-family: 'Syne', sans-serif;
            background: linear-gradient(45deg, #fff, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(0,255,255,0.15);
            letter-spacing: 0.5px;
        }

        .welcome-subtitle {
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            color: #b3e4ff;
            text-shadow: 0 0 8px rgba(0,255,255,0.12);
            margin-top: 4px;
        }

        /* ===== RELOJ ===== */
        .time-container {
            display: flex;
            justify-content: center;
            margin: 6px 0 12px;
            padding: 0 20px;
        }

        .neon-clock {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--primary);
            border-radius: 40px;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: var(--neon-glow);
        }

        #current-time {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 800;
            color: white;
            text-shadow: 0 0 8px var(--primary);
            font-family: 'Orbitron', monospace;
        }

        #current-date {
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            color: var(--accent);
            text-shadow: 0 0 6px var(--accent);
        }

        /* ===== CARPETAS DESPLEGABLES ===== */
        .folders-container {
            padding: 10px 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .folder-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.08);
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .folder-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            touch-action: manipulation;
        }

        .folder-header:hover {
            background: rgba(0, 240, 255, 0.05);
        }

        .folder-header .folder-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .folder-header .folder-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: rgba(0, 240, 255, 0.08);
            color: var(--primary);
        }

        .folder-header .folder-name {
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
        }

        .folder-header .folder-count {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
        }

        .folder-header .folder-arrow {
            font-size: 1rem;
            color: rgba(255,255,255,0.3);
            transition: transform 0.3s ease;
        }

        .folder-header.open .folder-arrow {
            transform: rotate(180deg);
        }

        .folder-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 18px;
        }

        .folder-body.open {
            max-height: 2000px;
            padding: 0 18px 18px;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            padding-top: 4px;
        }

        .folder-module {
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.08);
            border-radius: 8px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--light);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: clamp(0.55rem, 1vw, 0.7rem);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            text-align: center;
            gap: 6px;
            touch-action: manipulation;
        }

        .folder-module:hover {
            background: rgba(0, 240, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .folder-module i {
            font-size: clamp(1.4rem, 2.5vw, 1.8rem);
            color: var(--primary);
        }

        .folder-module:active {
            transform: scale(0.95);
        }

        .folder-module .mod-label {
            line-height: 1.2;
        }

        /* Colores por carpeta */
        .folder-wrapper.folder-herramientas .folder-icon { background: rgba(0, 240, 255, 0.12); color: #00f0ff; }
        .folder-wrapper.folder-herramientas .folder-header { border-left: 3px solid #00f0ff; }

        .folder-wrapper.folder-trading .folder-icon { background: rgba(255, 215, 0, 0.12); color: #ffd700; }
        .folder-wrapper.folder-trading .folder-header { border-left: 3px solid #ffd700; }

        .folder-wrapper.folder-social .folder-icon { background: rgba(255, 68, 230, 0.12); color: #ff44e6; }
        .folder-wrapper.folder-social .folder-header { border-left: 3px solid #ff44e6; }

        .folder-wrapper.folder-contenido .folder-icon { background: rgba(0, 255, 180, 0.12); color: #00ffb4; }
        .folder-wrapper.folder-contenido .folder-header { border-left: 3px solid #00ffb4; }

        .folder-wrapper.folder-vip .folder-icon { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
        .folder-wrapper.folder-vip .folder-header { border-left: 3px solid #ffd700; }

        /* ===== DESCARGA ===== */
        .download-section {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 16px 25px;
            margin: 5px 20px 25px;
            border: 1px solid rgba(255, 68, 230, 0.15);
            box-shadow: 0 8px 25px rgba(255, 68, 230, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: center;
            transition: all 0.3s ease;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .download-section:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        @media (min-width: 480px) {
            .download-section {
                flex-direction: row;
                padding: 16px 30px;
                margin: 5px 20px 25px;
            }
        }

        .download-btn {
            background: linear-gradient(145deg, var(--accent), #7700ff);
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-size: clamp(0.7rem, 1.4vw, 0.9rem);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 68, 230, 0.25);
            color: white;
            white-space: nowrap;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(255, 68, 230, 0.4);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        /* ===== FOOTER ===== */
        footer {
            background: rgba(10, 10, 26, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(0, 240, 255, 0.15);
            padding: 25px 20px 18px;
            text-align: center;
        }

        .footer-logo {
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            font-weight: 900;
            font-family: 'Syne', sans-serif;
            color: white;
            text-shadow: 0 0 12px var(--primary);
            margin-bottom: 12px;
        }

        .social-icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
        }

        .social-icons a {
            width: clamp(38px, 7vw, 48px);
            height: clamp(38px, 7vw, 48px);
            background: rgba(0, 255, 255, 0.04);
            border: 1px solid rgba(0, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            color: white;
            transition: all 0.3s ease;
            text-decoration: none;
            touch-action: manipulation;
            backdrop-filter: blur(4px);
        }

        .social-icons a:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-3px);
        }

        .copyright {
            text-align: center;
            font-size: clamp(0.5rem, 1vw, 0.65rem);
            color: rgba(224, 224, 255, 0.5);
            margin-top: 12px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .folder-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .folder-module {
                padding: 10px 6px;
                font-size: 0.55rem;
            }
            .folder-module i {
                font-size: 1.4rem;
            }
            .folder-header {
                padding: 12px 14px;
            }
            .folder-header .folder-name {
                font-size: 0.75rem;
            }
            .folder-body.open {
                padding: 0 12px 12px;
            }
            .download-section {
                padding: 14px 16px;
                margin: 5px 12px 18px;
                border-radius: 14px;
            }
            .download-btn {
                padding: 12px 24px;
                font-size: 0.8rem;
                width: 100%;
                justify-content: center;
            }
            @media (min-width: 480px) {
                .download-btn {
                    width: auto;
                }
            }
            .nav-container {
                padding: 0 12px;
            }
            .logo {
                font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            }
            .user-name {
                font-size: 0.6rem;
                padding: 3px 10px;
            }
            .logout-btn {
                padding: 5px 12px;
                font-size: 0.55rem;
            }
            .welcome-title {
                font-size: 1.4rem;
            }
            .neon-clock {
                padding: 5px 14px;
                gap: 8px;
            }
            #current-time {
                font-size: 0.85rem;
            }
            #current-date {
                font-size: 0.55rem;
            }
        }

        @media (max-width: 400px) {
            .folder-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            .folder-module {
                padding: 8px 4px;
                font-size: 0.5rem;
            }
            .folder-module i {
                font-size: 1.2rem;
            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .folder-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 901px) {
            .folder-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-height: 550px) and (orientation: landscape) {
            .welcome-section {
                padding: 6px 15px 2px;
            }
            .welcome-title {
                font-size: 1.1rem;
            }
            .time-container {
                margin: 2px 0 4px;
            }
            .neon-clock {
                padding: 3px 12px;
                gap: 6px;
            }
            #current-time {
                font-size: 0.7rem;
            }
            #current-date {
                font-size: 0.5rem;
            }
            .folders-container {
                padding: 5px 12px;
            }
            .folder-header {
                padding: 8px 12px;
            }
            .folder-header .folder-name {
                font-size: 0.65rem;
            }
            .folder-header .folder-icon {
                width: 28px;
                height: 28px;
                font-size: 0.9rem;
            }
            .folder-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 4px;
            }
            .folder-module {
                padding: 6px 4px;
                font-size: 0.45rem;
            }
            .folder-module i {
                font-size: 1rem;
            }
            .folder-body.open {
                padding: 0 10px 8px;
            }
            .download-section {
                padding: 6px 12px;
                margin: 3px 10px 8px;
                border-radius: 10px;
                flex-direction: row;
            }
            .download-btn {
                padding: 6px 16px;
                font-size: 0.6rem;
            }
            footer {
                padding: 8px 12px 6px;
            }
            .social-icons a {
                width: 30px;
                height: 30px;
                font-size: 0.75rem;
            }
            .footer-logo {
                font-size: 0.7rem;
                margin-bottom: 6px;
            }
            .copyright {
                font-size: 0.4rem;
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- CAPAS DE FONDO -->
    <div class="bg-image-layer"></div>
    <div class="grid-overlay"></div>
    <div class="glow-overlay"></div>
    
    <div class="content">
        <!-- LOADER -->
        <div class="loader-container" id="loader">
            <div class="loader-ring"></div>
            <div class="loader-text">YESLY ADELAY VIP</div>
            <div style="margin-top: 15px; font-size:0.8rem; letter-spacing:2px; color: var(--primary);">CARGANDO...</div>
        </div>

        <!-- HEADER -->
        <header>
            <div class="nav-container">
                <div class="logo">
                    <i class="fas fa-crown"></i>
                    <span>YESLY ADELAY</span>
                </div>
                <div class="user-profile">
                    <div class="user-name" id="displayName">
                        <i class="fas fa-user-astronaut"></i>
                        <span>Trader</span>
                    </div>
                    <button class="logout-btn" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                        SALIR
                    </button>
                </div>
            </div>
        </header>

        <main>
            <div class="welcome-section">
                <h1 class="welcome-title" id="welcomeMessage">BIENVENIDO, TRADER</h1>
                <p class="welcome-subtitle">DASHBOARD VIP · CARPETAS DESPLEGABLES</p>
            </div>

            <div class="time-container">
                <div class="neon-clock">
                    <i class="fas fa-clock"></i>
                    <div id="current-time">--:--:--</div>
                    <i class="fas fa-calendar-alt"></i>
                    <div id="current-date">Cargando...</div>
                </div>
            </div>

            <!-- CARPETAS DESPLEGABLES -->
            <div class="folders-container" id="foldersContainer">
                <!-- Generado por JavaScript -->
            </div>

            <!-- DESCARGA -->
            <div class="download-section">
                <div class="download-info">
                    <h2><i class="fas fa-bolt" style="color: var(--accent);"></i> YESLY ADELAY APP</h2>
                    <p>Poder cuántico en tu bolsillo</p>
                </div>
                <button class="download-btn" onclick="window.location.href='app.html'">
                    <i class="fas fa-download"></i> DESCARGAR
                </button>
            </div>
        </main>

        <!-- FOOTER CON REDES SOCIALES -->
        <footer>
            <div class="footer-logo">
                <i class="fas fa-crown"></i> YESLY ADELAY TRADING VIP
            </div>
            <div class="social-icons">

    <script>
        // ========== FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyB1Cs2os3tTfrMbYSAmDeJAGnP4tTtsFdw",
            authDomain: "beaver-trading.firebaseapp.com",
            databaseURL: "https://beaver-trading-default-rtdb.firebaseio.com",
            projectId: "beaver-trading",
            storageBucket: "beaver-trading.firebasestorage.app",
            messagingSenderId: "926610131904",
            appId: "1:926610131904:web:c147bd337bd12b4d085625",
            measurementId: "G-1K51WWF2ZJ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ========== LOADER ==========
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.classList.add('fade-out');
                setTimeout(() => loader.style.display = 'none', 800);
            }, 1200);
        });

        function showLoaderMsg(msg) {
            const loader = document.getElementById('loader');
            if (loader.style.display === 'none') loader.style.display = 'flex';
            loader.classList.remove('fade-out');
            document.querySelector('.loader-text').textContent = msg || 'PROCESANDO...';
        }
        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.classList.add('fade-out');
            setTimeout(() => loader.style.display = 'none', 600);
        }

        // ========== RELOJ ==========
        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString('es-ES', { hour12: false });
            document.getElementById('current-date').textContent = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ========== DATOS DE MÓDULOS CON CARPETAS ==========
        const modulesData = [
            { icon: 'fa-cubes', label: 'Módulos', link: 'modulos.html', folder: 'herramientas' },
            { icon: 'fa-chart-pie', label: 'Yeslyface', link: 'https://faceyesly.vercel.app', folder: 'social' },
            { icon: 'fa-chart-line', label: 'Gráfico', link: 'grafico.html', folder: 'trading' },
            { icon: 'fa-broadcast-tower', label: 'Señales', link: 'senales.html', folder: 'trading' },
            { icon: 'fa-sliders-h', label: 'Gestión', link: 'gestion.html', folder: 'herramientas' },
            { icon: 'fa-coins', label: 'Inversión', link: 'invest.html', folder: 'trading' },
            { icon: 'fa-chart-bar', label: 'Fibonacci', link: 'fibonacci.html', folder: 'trading' },
            { icon: 'fa-comments', label: 'Chats', link: 'chats.html', folder: 'social' },
            { icon: 'fa-hand-holding-dollar', label: 'Pagos', link: 'pagos.html', folder: 'herramientas' },
            { icon: 'fa-globe-americas', label: 'Hora', link: 'hora.html', folder: 'herramientas' },
            { icon: 'fa-newspaper', label: 'Contenido', link: 'contenido.html', folder: 'contenido' },
            { icon: 'fa-hand-holding-usd', label: 'Préstamo', link: 'soporte.html', folder: 'herramientas' },
            { icon: 'fa-video', label: 'Videos', link: 'https://pag123.vercel.app', folder: 'contenido' },
            { icon: 'fa-file-pdf', label: 'PDF', link: 'pdf.html', folder: 'contenido' },
            { icon: 'fa-user-tie', label: 'MT5', link: 'app-descarga.html', folder: 'trading' },
            { icon: 'fa-cloud-download-alt', label: 'App', link: 'app.html', folder: 'herramientas' },
            { icon: 'fa-share-alt', label: 'Redes', link: 'sociales.html', folder: 'social' },
            { icon: 'fa-rocket', label: 'VIP', link: 'modulos.html', folder: 'vip' }
        ];

        // ========== CONFIGURACIÓN DE CARPETAS ==========
        const folderConfig = {
            herramientas: {
                icon: 'fa-tools',
                label: 'Herramientas',
                color: '#00f0ff'
            },
            trading: {
                icon: 'fa-chart-line',
                label: 'Trading',
                color: '#ffd700'
            },
            social: {
                icon: 'fa-share-alt',
                label: 'Social',
                color: '#ff44e6'
            },
            contenido: {
                icon: 'fa-file-alt',
                label: 'Contenido',
                color: '#00ffb4'
            },
            vip: {
                icon: 'fa-crown',
                label: 'VIP',
                color: '#ffd700'
            }
        };

        // ========== RENDER CARPETAS DESPLEGABLES ==========
        const foldersContainer = document.getElementById('foldersContainer');

        function renderFolders() {
            foldersContainer.innerHTML = '';

            // Agrupar módulos por carpeta
            const grouped = {};
            modulesData.forEach(mod => {
                if (!grouped[mod.folder]) grouped[mod.folder] = [];
                grouped[mod.folder].push(mod);
            });

            // Renderizar cada carpeta
            Object.keys(grouped).forEach(folderKey => {
                const modules = grouped[folderKey];
                const config = folderConfig[folderKey] || {
                    icon: 'fa-folder',
                    label: folderKey.toUpperCase(),
                    color: '#ffffff'
                };

                const wrapper = document.createElement('div');
                wrapper.className = `folder-wrapper folder-${folderKey}`;
                
                // Header
                const header = document.createElement('div');
                header.className = 'folder-header';
                header.innerHTML = `
                    <div class="folder-info">
                        <div class="folder-icon"><i class="fas ${config.icon}"></i></div>
                        <div>
                            <div class="folder-name">${config.label}</div>
                            <div class="folder-count">${modules.length} módulos</div>
                        </div>
                    </div>
                    <div class="folder-arrow"><i class="fas fa-chevron-down"></i></div>
                `;

                // Body
                const body = document.createElement('div');
                body.className = 'folder-body';
                
                const grid = document.createElement('div');
                grid.className = 'folder-grid';

                modules.forEach(mod => {
                    const link = document.createElement('a');
                    link.className = 'folder-module';
                    link.href = mod.link;
                    link.target = '_blank';
                    link.innerHTML = `
                        <i class="fas ${mod.icon}"></i>
                        <span class="mod-label">${mod.label}</span>
                    `;
                    grid.appendChild(link);
                });

                body.appendChild(grid);
                wrapper.appendChild(header);
                wrapper.appendChild(body);
                foldersContainer.appendChild(wrapper);

                // Toggle al hacer clic en el header
                header.addEventListener('click', function(e) {
                    e.preventDefault();
                    this.classList.toggle('open');
                    const bodyEl = this.nextElementSibling;
                    bodyEl.classList.toggle('open');
                });

                // Abrir la primera carpeta por defecto
                if (folderKey === 'herramientas') {
                    header.classList.add('open');
                    body.classList.add('open');
                }
            });
        }

        renderFolders();

        // ========== AUTENTICACIÓN ==========
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                const userId = user.uid;
                database.ref('users/' + userId).once('value').then((snapshot) => {
                    const userData = snapshot.val();
                    let displayName = 'Trader';
                    if (userData && userData.fullName) {
                        displayName = userData.fullName.split(' ')[0];
                    } else if (userData && userData.name) {
                        displayName = userData.name.split(' ')[0];
                    } else if (user.email) {
                        displayName = user.email.split('@')[0];
                    }
                    const nameEl = document.querySelector('#displayName span');
                    if (nameEl) nameEl.textContent = displayName;
                    document.getElementById('welcomeMessage').innerHTML = `BIENVENIDO, ${displayName.toUpperCase()}`;
                }).catch(() => {
                    document.querySelector('#displayName span').textContent = 'TRADER';
                });
            }
        });

        // ========== CERRAR SESIÓN ==========
        document.getElementById('logoutBtn').addEventListener('click', () => {
            showLoaderMsg('Cerrando sesión...');
            auth.signOut().then(() => {
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }).catch((err) => {
                alert('Error: ' + err.message);
                hideLoader();
            });
        });
    </script>
